<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#EEF2F7" />
  <path d="M700 205 C820 110 1018 142 1070 288 C1125 440 995 542 830 508 C742 490 684 435 664 356" fill="none" stroke="#DCEBFF" stroke-width="54" stroke-linecap="round" opacity="0.52" />
  <text x="82" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="36" fill="#304763">Harness：把翻车变成学习材料</text>

  <g id="step_fail">
