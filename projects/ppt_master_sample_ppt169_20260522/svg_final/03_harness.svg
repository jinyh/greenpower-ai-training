  </g>
  <path d="M246 220 H354" stroke="#0866D8" stroke-width="4" />
  <path d="M354 220 l-18 -11 v22 Z" fill="#0866D8" />
  <g id="step_find">
    <circle cx="448" cy="220" r="48" fill="#0866D8" />
    <circle cx="448" cy="220" r="22" fill="none" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="448" cy="220" r="7" fill="#FFFFFF" />
    <text x="426" y="312" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0866D8">发现</text>
  </g>
  <path d="M530 220 H638" stroke="#0866D8" stroke-width="4" />
  <path d="M638 220 l-18 -11 v22 Z" fill="#0866D8" />
  <g id="step_add_harness">
    <circle cx="732" cy="220" r="48" fill="#0866D8" />
    <path d="M732 194 l28 12 v25 c0 22 -14 36 -28 42 c-14 -6 -28 -20 -28 -42 v-25 Z" fill="none" stroke="#FFFFFF" stroke-width="5" />
    <path d="M720 230 l9 9 l18 -22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <text x="684" y="312" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0866D8">加 Harness</text>
  </g>
  <path d="M814 220 H922" stroke="#0866D8" stroke-width="4" />
  <path d="M922 220 l-18 -11 v22 Z" fill="#0866D8" />
  <g id="step_review">
    <circle cx="1016" cy="220" r="48" fill="#0866D8" />
    <path d="M994 205 h32 v32 h-32 Z M1005 216 l8 8 l18 -22 M1008 192 h32 v32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <text x="994" y="312" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0866D8">复核</text>
  </g>

  <g id="format_card">
    <path fill="#FFFFFF" stroke="#0866D8" stroke-width="2" d="M108,382 H572 A8,8 0 0 1 580,390 V456 A8,8 0 0 1 572,464 H108 A8,8 0 0 1 100,456 V390 A8,8 0 0 1 108,382 Z" />
    <circle cx="142" cy="423" r="24" fill="#0866D8" />
    <path d="M132 416 h20 M132 423 h20 M132 430 h14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M190 398 h150 l-14 42 h-150 Z" fill="#0866D8" />
    <text x="228" y="426" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">输出格式</text>
    <text x="372" y="430" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">让结果可读、可复制、可评分</text>
  </g>

  <g id="boundary_card">
    <path fill="#FFFFFF" stroke="#0866D8" stroke-width="2" d="M668,382 H1132 A8,8 0 0 1 1140,390 V456 A8,8 0 0 1 1132,464 H668 A8,8 0 0 1 660,456 V390 A8,8 0 0 1 668,382 Z" />
    <circle cx="702" cy="423" r="24" fill="#0866D8" />
    <path d="M702 404 l18 8 v18 c0 14 -8 24 -18 28 c-10 -4 -18 -14 -18 -28 v-18 Z" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <path d="M694 424 l6 6 l12 -16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M750 398 h150 l-14 42 h-150 Z" fill="#0866D8" />
    <text x="788" y="426" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">边界约束</text>
    <text x="932" y="430" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">只基于给定材料，未提及就标注</text>
  </g>

  <g id="analysis_card">
    <path fill="#FFFFFF" stroke="#0866D8" stroke-width="2" d="M108,498 H572 A8,8 0 0 1 580,506 V572 A8,8 0 0 1 572,580 H108 A8,8 0 0 1 100,572 V506 A8,8 0 0 1 108,498 Z" />
    <circle cx="142" cy="539" r="24" fill="#0866D8" />
    <path d="M130 542 h24 M130 542 C130 530 154 530 154 542 M134 553 C142 561 150 561 158 553" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M190 514 h150 l-14 42 h-150 Z" fill="#0866D8" />
    <text x="228" y="542" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">分析过程</text>
    <text x="372" y="546" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">要求依据、置信度、反方观点</text>
  </g>

  <g id="validation_card">
    <path fill="#FFFFFF" stroke="#0866D8" stroke-width="2" d="M668,498 H1132 A8,8 0 0 1 1140,506 V572 A8,8 0 0 1 1132,580 H668 A8,8 0 0 1 660,572 V506 A8,8 0 0 1 668,498 Z" />
    <circle cx="702" cy="539" r="24" fill="#0866D8" />
    <path d="M692 539 l8 8 l18 -22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <path d="M750 514 h150 l-14 42 h-150 Z" fill="#0866D8" />
    <text x="788" y="542" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">校验机制</text>
    <text x="932" y="546" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">列出不确定点、异常数据和信息缺口</text>
  </g>

  <rect x="42" y="640" width="1196" height="62" fill="#FFFFFF" />
  <circle cx="102" cy="671" r="28" fill="#0866D8" />
  <path d="M82 666 l20 -10 l20 10 l-20 10 Z M90 673 v12 c8 7 17 7 24 0 v-12" fill="none" stroke="#FFFFFF" stroke-width="3" />
  <text x="150" y="664" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#0866D8">教学启示：</text>
  <text x="150" y="690" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">翻车不是失败，而是把 Harness 设计出来的机会。</text>
  <text x="1218" y="690" font-family="Arial, sans-serif" font-size="16" fill="#8A96A3">2</text>
</svg>