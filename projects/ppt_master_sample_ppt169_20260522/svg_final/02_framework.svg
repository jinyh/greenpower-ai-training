<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#EEF2F7"/>
  <path d="M0 610 C160 560 280 650 460 612 C650 570 780 610 960 584 C1100 562 1190 590 1280 552 L1280 720 L0 720 Z" fill="#DCEBFF" fill-opacity="0.42"/>
  <circle cx="520" cy="332" r="182" fill="none" stroke="#BFD0E3" stroke-width="2" opacity="0.4"/>
  <path d="M338 332 H462 M578 332 H702 M818 332 H942" stroke="#0866D8" stroke-width="4"/>
  <path d="M462 332 l-16 -10 v20 Z M702 332 l-16 -10 v20 Z M942 332 l-16 -10 v20 Z" fill="#0866D8"/>

  <text x="82" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="36" fill="#304763">驾驭 Agent 的三要素</text>
  <text x="244" y="184" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#304763">这不是技巧堆叠，而是一套可迁移的控制框架。</text>

  <g id="prompt_module">
    <circle cx="268" cy="330" r="46" fill="#0866D8"/>
    <circle cx="268" cy="330" r="21" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="268" cy="330" r="7" fill="#FFFFFF"/>
    <path d="M170 396 h190 l-18 46 h-190 Z" fill="#0866D8"/>
    <text x="210" y="427" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Prompt</text>
    <text x="220" y="492" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#304763">任务方向</text>
    <text x="150" y="548" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">要做什么、给谁看、输出什么格式</text>
  </g>

  <g id="context_module">
    <circle cx="640" cy="330" r="46" fill="#0866D8"/>
    <path d="M618 315 h44 v34 h-44 Z M626 307 h28" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <path d="M542 396 h190 l-18 46 h-190 Z" fill="#0866D8"/>
    <text x="586" y="427" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Context</text>
    <text x="592" y="492" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#304763">信息质量</text>
    <text x="514" y="548" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">Agent 能看到什么材料、记得什么背景</text>
  </g>

  <g id="harness_module">
    <circle cx="1012" cy="330" r="46" fill="#0866D8"/>
    <path d="M1012 303 l28 12 v25 c0 22 -14 36 -28 42 c-14 -6 -28 -20 -28 -42 v-25 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1000 340 l9 9 l18 -22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M914 396 h190 l-18 46 h-190 Z" fill="#0866D8"/>
    <text x="955" y="427" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Harness</text>
    <text x="964" y="492" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#304763">输出边界</text>
    <text x="902" y="538" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">不能做什么、不确定时怎么办、如何校验</text>
  </g>

  <line x1="148" y1="603" x2="1132" y2="603" stroke="#304763" stroke-width="2"/>
  <rect x="42" y="640" width="1196" height="62" fill="#FFFFFF"/>
  <circle cx="102" cy="671" r="28" fill="#0866D8"/>
  <path d="M82 666 l20 -10 l20 10 l-20 10 Z M90 673 v12 c8 7 17 7 24 0 v-12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="150" y="664" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#0866D8">教学启示：</text>
  <text x="150" y="690" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#5B6775">Prompt 定方向，Context 定质量，Harness 定边界。</text>
  <text x="1218" y="690" font-family="Arial, sans-serif" font-size="16" fill="#8A96A3">1</text>
</svg>
